name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - run: pnpm --filter docs build
      # The showcase is a client bundle, so the project id is public by design; keep it in a
      # repository variable, not a secret.
      - run: pnpm --filter showcase build
        env:
          WC_PROJECT_ID: ${{ vars.WC_PROJECT_ID }}
      # One Pages site per repository: the showcase rides along inside the docs artifact.
      - run: cp -R packages/showcase/dist packages/docs/dist/showcase
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
